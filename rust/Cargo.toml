[package]
name = "logklerk"
version = "0.0.2"
edition = "2021"
description = "Lightning-fast terminal journaling and timestamp logger into a plain Markdown vault."
authors = ["regawaras (github.com/regawaras)"]
license = "MIT"
repository = "https://github.com/regawaras/lk"
homepage = "https://github.com/regawaras/lk"
keywords = ["cli", "journaling", "logging", "note-taking", "markdown"]
categories = ["command-line-utilities"]

[[bin]]
name = "lk"
path = "src/main.rs"

[dependencies]


[profile.release]
opt-level = "z"     
lto = true         
strip = true       

